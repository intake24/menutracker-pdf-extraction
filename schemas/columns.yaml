# Column dictionary shared by every chain CSV. Order here = column order in every CSV.
# A chain CSV contains only the columns that have a value for that chain.
# Names were first modelled on Costa Coffee's export. Add a column here before any parser emits it.
# Columns below that no chain uses yet (Milk, CoffeeType, Number_of_Slices, most vitamin/zinc/caffeine bases) belong to the shared
# Menu Tracker format and are kept for future chains.
# Every row also ends with five provenance columns the pipeline adds (see PROVENANCE in pipeline/columns.py), not listed below:
#   region       UK, NI or ROI
#   source_file  the PDF the row was read from
#   source_page  its page (two pages joined with ", " for a merged product)
#   method       parser (read from the PDF's text layer) or llm (read from the page image by a model)
#   flags        "error: ..." / "warn: ..." checks joined with " | "; informational, values are never changed
version: 1
text_columns: [Product_Name, Product_Description, Size, Milk, CoffeeType, Ingredients,
               Category, Serving_Size, Serving_Size_Unit, Diet, notes,
               # counts and amounts printed per product (Domino's, Pizza Hut, Papa John's), kept as printed
               Serves, Portion_Type, Portion_Size, Number_of_Slices, Number_of_Portions, Recommended_Portions,
               Total_Slices, Total_Pieces, Total_Portions, Total_Weight,
               Suitable_for_Vegetarian, Suitable_for_Vegan, Suitable_for_Coeliac, Suitable_for_Halal,
               Pack_Size, Storage, Instructions, Cheese, Crust]
bases: ["Per 100g/ml", "Per Portion", "Per Pizza", "Per Slice", "Per Product As Sold"]
nutrients: [carbohydrates, energykCal, energykJ, fat, fibre, protein, salt, saturates, sugars,
            vitaminB6, vitaminB12, vitaminC, zinc, sodium, caffeine]
# A nutrient cell holds the PDF's value as printed: a number, "<number", or one of these words. Three flagged clean-ups apply first
# (pipeline/export.py `normalise`): g or mg after the number is removed, a decimal comma becomes a point, and a thousands comma in kJ/kcal is removed.
nutrient_words: [Negligible, Trace, Traces, Tr, N/A, NA, "-", not declared]
allergens: [gluten, wheat, rye, barley, oats, spelt, kamut, celery, crustacean, egg, fish, lupin,
            milk, mollusc, mustard, peanut, sesame, soya, sulphite, treeNuts]
trailing_text_columns: [treeNutSource]

# The research team's template for column headings (their "Variable" and "Standardised format"). write_csv applies it: a CSV in outputs/ carries
# the standard heading for each of these columns (a rename, no value changes); code, config and golden/ use our names, and
# evaluate.read_output maps the headings back. Key = our column, standard = the template's heading, variable = the template's description. config/pearlscan_columns.yaml
# maps the same headings the other way round (template heading -> our column) for `eval`. Our names add the basis to the nutrient
# ("_Per Portion", "_Per 100g/ml") and also cover bases the template does not (Per Pizza, Per Slice, Per Product As Sold).
standard_headings:
  Category: { standard: menu_section, variable: Menu section }
  Product_Name: { standard: item_name, variable: Item name }
  Serving_Size: { standard: servingsize, variable: Serving size }
  Serving_Size_Unit: { standard: servingsizeunit, variable: Serving size unit }
  energykCal_Per Portion: { standard: kcal, variable: Energy kcal per serving/portion }
  energykCal_Per 100g/ml: { standard: kcal_100, variable: Energy kcal per 100g }
  energykJ_Per Portion: { standard: kj, variable: Energy kj per serving/portion }
  energykJ_Per 100g/ml: { standard: kj_100, variable: Energy kj per 100g }
  protein_Per Portion: { standard: protein, variable: Protein per serving/portion }
  protein_Per 100g/ml: { standard: protein_100, variable: Protein per 100g }
  carbohydrates_Per Portion: { standard: carb, variable: Carbohydrates per serving/portion }
  carbohydrates_Per 100g/ml: { standard: carb_100, variable: Carbohydrates per 100g }
  sugars_Per Portion: { standard: sugar, variable: Sugar per serving/portion }
  sugars_Per 100g/ml: { standard: sugar_100, variable: Sugar per 100g }
  fat_Per Portion: { standard: fat, variable: Fat per serving/portion }
  fat_Per 100g/ml: { standard: fat_100, variable: Fat per 100g }
  saturates_Per Portion: { standard: satfat, variable: Saturated fat per serving/portion }
  saturates_Per 100g/ml: { standard: satfat_100, variable: Saturated fat per 100g }
  fibre_Per Portion: { standard: fibre, variable: Fibre per serving/portion }
  fibre_Per 100g/ml: { standard: fibre_100, variable: Fibre per 100g }
  salt_Per Portion: { standard: salt, variable: Salt per serving/portion }
  salt_Per 100g/ml: { standard: salt_100, variable: Salt per 100g }
