# Column dictionary shared by every chain CSV. Order here = column order in every CSV.
# A chain CSV contains only the columns that have a value for that chain.
# Names were first modelled on Costa Coffee's export. Add a column here before any parser emits it.
# Columns below that no chain uses yet (Milk, CoffeeType, Number_of_Slices, most vitamin/zinc/caffeine bases) belong to the shared
# Menu Tracker format and are kept for future chains.
# Every row also ends with five provenance columns the pipeline adds (see PROVENANCE in pipeline/columns.py), not listed below:
#   region       UK, NI or ROI
#   source_file  the PDF the row was read from
#   source_page  its page (two pages joined with ", " for a merged product)
#   method       parser (read from the PDF's text layer) or llm (read from the page image by a model)
#   flags        "error: ..." / "warn: ..." checks joined with " | "; informational, values are never changed
version: 1
text_columns: [Product_Name, Product_Description, Size, Milk, CoffeeType, Ingredients,
               Category, Serving_Size, Serving_Size_Unit, Diet, notes,
               # counts and amounts printed per product (Domino's, Pizza Hut, Papa John's), kept as printed
               Serves, Portion_Type, Portion_Size, Number_of_Slices, Number_of_Portions, Recommended_Portions,
               Total_Slices, Total_Pieces, Total_Portions, Total_Weight,
               Suitable_for_Vegetarian, Suitable_for_Vegan, Suitable_for_Coeliac, Suitable_for_Halal,
               Pack_Size, Storage, Instructions, Cheese, Crust]
bases: ["Per 100g/ml", "Per Portion", "Per Pizza", "Per Slice", "Per Product As Sold"]
nutrients: [carbohydrates, energykCal, energykJ, fat, fibre, protein, salt, saturates, sugars,
            vitaminB6, vitaminB12, vitaminC, zinc, sodium, caffeine]
# A nutrient cell holds the PDF's value as printed: a number, "<number", or one of these words.
nutrient_words: [Negligible, Trace, Traces, Tr, N/A, NA, "-", not declared]
allergens: [gluten, wheat, rye, barley, oats, spelt, kamut, celery, crustacean, egg, fish, lupin,
            milk, mollusc, mustard, peanut, sesame, soya, sulphite, treeNuts]
trailing_text_columns: [treeNutSource]
