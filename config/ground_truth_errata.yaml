# Mistakes in Pearl Scan's CSVs, found by comparing with the PDF. Each: file (CSV name), item (its item_name),
# column (Pearl Scan column, or "*" for the whole row), why.
- file: 25-04-03_20Cineworld_20Allergen_20and_20Nutritional_20Information.csv
  item: Tango Orange Sugar Free - Diet Pepsi
  column: "*"
  why: The PDF lists "Diet Pepsi, 200 ml, 1.2 kcal" as an item of its own, below the Tango Orange Sugar Free group; Pearl Scan filed it as a size of Tango.
- file: m19982-nutritional-info-food.csv
  item: Pork Frankfurter - Large
  column: fibre
  why: The PDF prints a stray "g" after this figure ("0g", "2.7g"); Pearl Scan removed it. We keep it as printed and the row is flagged.
