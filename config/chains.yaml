          Soya Milk,
          Sugar Free Caramel,
          Sugar Free Vanilla,
          Chocolate,
          Hazelnut,
        ]
      units: [g, ml]
      note_labels: [Pick and Mix, Ice Cream]
      group_column_end: 92 # the left-most column (item group names, sub-sections) ends here
      header_words: [Allergens, Tree, Nuts, Cereals, Containing, Gluten]
