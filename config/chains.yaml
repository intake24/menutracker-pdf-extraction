        'VALUES PER PORTION / NO. OF PORTIONS Piece': Number_of_Portions
        'VALUES PER PORTION (1 Cookie) / ENERGY kcal per Portion': energykCal_Per Portion
        'VALUES PER PORTION (1 Cookie) / ENERGY kcal per Total': energykCal_Per Product As Sold
        'VALUES PER PORTION (1 Cookie) / TOTAL PRODUCT WEIGHT g': Total_Weight
        'VALUES PER PORTION (1 Cookie) / PORTION SIZE g': Serving_Size|g
        'VALUES PER PORTION (1 Cookie) / PORTION SIZE Slice': Portion_Size@Slice
        'VALUES PER PORTION (1 Cookie) / PORTION SIZE Piece': Portion_Size@Piece
        'VALUES PER PORTION (1 Cookie) / RECOMMENDED PORTION SIZE Serving': Recommended_Portions
        'VALUES PER PORTION (1 Cookie) / TOTAL SLICES SLICE': Total_Slices
        'VALUES PER PORTION (1 Cookie) / TOTAL PORTION SIZE Slice': Total_Slices
        'VALUES PER PORTION (1 Cookie) / TOTAL PORTION SIZE Box of': Total_Pieces
        'VALUES PER PORTION (1 Cookie) / TOTAL PORTIONS Box of': Total_Portions
        'VALUES PER PORTION (1 Cookie) / TOTAL IN BOX Pieces': Total_Pieces
        'VALUES PER PORTION (1 Cookie) / TOTAL IN BOX Box of': Total_Pieces
        'VALUES PER PORTION (1 Cookie) / NO. OF PORTIONS Per box': Number_of_Portions
        'VALUES PER PORTION (1 Cookie) / NO. OF PORTIONS Piece': Number_of_Portions
      pearlscan:
        {
          kcal: energykCal_Per Product As Sold,
          total_weight: Total_Weight,
          portion_size_g: Serving_Size,
          portion_size: [Portion_Size],
          total_slices: Total_Slices,
          num_of_portions: [Number_of_Portions, Portion_Size],
          total_pieces: [Total_Pieces, Total_Portions],
          recommended_portions: [Recommended_Portions, Portion_Size],
          total_portions: [Total_Portions, Total_Pieces],
        }

35_KrispyKreme:
  chain: KrispyKreme
  sources:
    # No text layer: the page images are read by the model (parser vision_pairs). Each product has an allergen page (YES/NO
    # diet cells, ticks) and a nutrition page; rows are paired in page order. Ingredient-declaration pages are not extracted.
    # Key (page 2): a tick means the product contains the allergen; it does not say what a blank means (blank = not stated).
    - pdf: 2025_Allergen_Nutrition_Book_230525_UK__Minions_.pdf
      parser: vision_pairs
      region: UK
      category: food
      approved: true
      dpi: 200
      name_fixes: { Original Glazed Birthday: Original Glazed } # Pearl Scan added "Birthday" to the name of the page 27/28 item
      markers: { '✓': 'Yes', '': '' }
      instructions: >-
        It is a doughnut shop's allergen and nutrition guide; each page is one table of products grouped under grey headings.
        The product name is the bold text beside the picture; some have an italic line under it in brackets.
      joins:
        - { matrix: [3], nutrition: [4] }
        - { matrix: [5], nutrition: [6] }
        - { matrix: [7], nutrition: [8] }
        - { matrix: [9], nutrition: [10] }
        - { matrix: [11], nutrition: [12] }
