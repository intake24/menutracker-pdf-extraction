6_Dominos:
  chain: Dominos
  allergens: false # the March 2026 batch has nutrition only (docs/goal-batch-2026-03.md)
  sources:
    - pdf: nutrition_sides-and-desserts.pdf
      golden: nutrition_sides-and-desserts__2026-06 # the March 2026 PDF has the same name
      parser: numeric_table
      region: UK
      category: food
      approved: true
      # No allergen information in these PDFs, so no `markers` and the CSV has no allergen columns.
      # The first row of page 4 has the header's unit line inside its cells: "(g)14.3", "KCal356", "kJ1496". Kept as printed and flagged.
      invalid_values: ['re:^\(g\)\d+(\.\d+)?$', KCal356, kJ1496]
      skip_words: ['(g)']
      header: Energy
      wrapped_names: true
      text_values: [Portion, Piece, Dip, Wrap]
      name_amount: true # "BBQ Dip 25g": the amount is the serving size
      furniture: ['Nutritional Information- Sides and Desserts', Product Name, 'Per Product As Sold Per Portion or Piece', 'Per Product As Sold Per Portion or Dip'] # running head; the name column's header
      titles: [Sides, Dips, Chick 'N' Dip] # a page's title, printed above its column headers
      # Columns left to right (the 2026 PDF has no per 100g group): how many it serves, ten per product as sold,
      # the portion's kind (words), then ten per portion or piece.
      columns:
        - Serves
        - energykCal_Per Product As Sold
        - energykJ_Per Product As Sold
        - fat_Per Product As Sold
        - saturates_Per Product As Sold
        - carbohydrates_Per Product As Sold
        - sugars_Per Product As Sold
        - fibre_Per Product As Sold
        - protein_Per Product As Sold
        - salt_Per Product As Sold
        - sodium_Per Product As Sold
        - Portion_Type
        - energykCal_Per Portion
        - energykJ_Per Portion
        - fat_Per Portion
        - saturates_Per Portion
        - carbohydrates_Per Portion
        - sugars_Per Portion
        - fibre_Per Portion
        - protein_Per Portion
        - salt_Per Portion
        - sodium_Per Portion
    - pdf: nutrition_pizzas.pdf
      golden: nutrition_pizzas__2026-06 # the March 2026 PDF has the same name
      parser: grouped_table
      region: UK
      category: food
      approved: true
      # No allergen information in this PDF. Pages 3-16: pizza name, rotated cheese label, crust, then one row per size.
      # KNOWN GAP: page 2 (95 rows: gluten free, plant-based, cheeky little, Italiano trial-store, delight pizzas, Absolute Banger) is
      # not extracted yet: its six small tables label rows differently and one model read of the whole page returned no rows.
      pages: ['3-16']
      size_x0: 190
      size_order: [Large, Medium, Small, Personal]
      left:
        - {
            column: Product_Name,
            x0: 0,
            starts_at: { Cheese: Standard Mozzarella },
          }
        - { column: Cheese, x0: 90, rotated: true }
        - { column: Crust, x0: 103 }
      pearlscan: { 'slice/portion/piece': ~ }
      # Figures left to right: ten per pizza, ten per slice (the 2026 PDF has no per 100g group).
      columns:
        - energykCal_Per Pizza
        - energykJ_Per Pizza
        - fat_Per Pizza
        - saturates_Per Pizza
        - carbohydrates_Per Pizza
        - sugars_Per Pizza
        - fibre_Per Pizza
        - protein_Per Pizza
        - salt_Per Pizza
        - sodium_Per Pizza
        - energykCal_Per Slice
        - energykJ_Per Slice
        - fat_Per Slice
        - saturates_Per Slice
        - carbohydrates_Per Slice
        - sugars_Per Slice
        - fibre_Per Slice
        - protein_Per Slice
        - salt_Per Slice
        - sodium_Per Slice
    - pdf: nutrition_pizzas.pdf
      golden: nutrition_pizzas__2026-06 # the March 2026 PDF has the same name
      parser: grouped_table
      region: UK
      category: food
      approved: true
      # Page 17: bases (crust label, then one row per size; figures per pizza, per slice).
      pages: [17]
      size_x0: 180
      size_order: [Large, Medium, Small, Personal]
      left:
        - { column: Product_Name, x0: 0 }
      pearlscan: { 'slice/portion/piece': ~ }
      columns:
        - energykCal_Per Pizza
        - energykJ_Per Pizza
        - fat_Per Pizza
        - saturates_Per Pizza
        - carbohydrates_Per Pizza
        - sugars_Per Pizza
        - fibre_Per Pizza
        - protein_Per Pizza
        - salt_Per Pizza
        - sodium_Per Pizza
        - energykCal_Per Slice
        - energykJ_Per Slice
        - fat_Per Slice
        - saturates_Per Slice
        - carbohydrates_Per Slice
        - sugars_Per Slice
        - fibre_Per Slice
        - protein_Per Slice
        - salt_Per Slice
        - sodium_Per Slice
    - pdf: nutrition_pizzas.pdf
      golden: nutrition_pizzas__2026-06 # the March 2026 PDF has the same name
      parser: grouped_table
      region: UK
      category: food
      approved: true
      # Pages 18-20: sauce, cheese and toppings: one row per size with the single serve figures (the 2026 PDF has no per 100g row).
      pages: [18, 19, 20]
      size_x0: 192
      size_order: [Large, Medium, Small, Personal]
      ignore_words: [Per, single, serve]
      left:
        - { column: Product_Name, x0: 0, x1: 190 } # the "Per single serve" label beside the names is not a name
      pearlscan: { 'slice/portion/piece': ~ }
      columns:
        - energykCal_Per Portion
        - energykJ_Per Portion
        - fat_Per Portion
        - saturates_Per Portion
        - carbohydrates_Per Portion
        - sugars_Per Portion
        - fibre_Per Portion
        - protein_Per Portion
        - salt_Per Portion
        - sodium_Per Portion
    - pdf: nutrition_pizzas.pdf
      golden: nutrition_pizzas__2026-06 # the March 2026 PDF has the same name
      parser: vision_products
      region: UK
      category: food
      approved: true
      # Page 2 only (gluten free, plant-based, cheeky little, Italiano range, delight pizzas and Absolute Banger; the
      # Italiano table is new in the April 2026 guide). The page holds six small tables with different row labels, so each table is cropped and read from its image. No allergen information.
      pages: [2]
      dpi: 150
      variant_columns: true
      snap_labels: [Product_Name, Crust] # a label the model misread (Margherita-tastic for Margheri-tastic) is replaced by the printed one
      # The print on this page is too small for the model: at 150 dpi it misread about a quarter of the figures (758 for 708).
      # So only the labels (section, pizza, cheese, crust, size) come from the model; every figure comes from the text layer.
      figures_from_text:
        line_gap: 3.5 # rows of the Plant-Based and Italiano tables print their per slice figures 3 pt below the per pizza ones (at 3 and 4.5 one row of the new Italiano table stays split in two lines of ten figures)
        size_x0: 192
        size_order: [Large, Medium, Small, Personal]
        columns:
          - energykCal_Per Pizza
          - energykJ_Per Pizza
          - fat_Per Pizza
          - saturates_Per Pizza
          - carbohydrates_Per Pizza
          - sugars_Per Pizza
          - fibre_Per Pizza
          - protein_Per Pizza
          - salt_Per Pizza
          - sodium_Per Pizza
          - energykCal_Per Slice
          - energykJ_Per Slice
          - fat_Per Slice
          - saturates_Per Slice
          - carbohydrates_Per Slice
          - sugars_Per Slice
          - fibre_Per Slice
          - protein_Per Slice
          - salt_Per Slice
          - sodium_Per Slice
      crop_dpi: { 2-4: 230, 2-6: 230 } # the two big tables (Italiano range, Absolute Banger): their print is too small at 150
      crops:
        {
          2:
            [
              [80, 138],
              [138, 212],
              [212, 298],
              [298, 512],
              [512, 572],
              [572, 770],
            ],
        }
      instructions: >-
        It is part of a Domino's UK nutrition table page: one small table with its own column titles (the left block of ten columns is titled Per Pizza and the right block
        Per Slice, each with Energy kcal, Energy kJ, Fat, Sat, Carb, Sugars, Fibre, Protein, Salt, Sodium). Every row has a size
        (Small, Medium, Large or Personal) and a pizza label. section = the range heading printed at the left of the table (for
        example "Gluten Free Pizzas", "Plant-Based Pizzas", "Cheeky Little Pizzas", "Delight Pizzas", "Absolute
        Banger"), or empty if the image shows none. name = the pizza name exactly as printed in the pizza name column, including a
        trial stores note when it is part of the printed name. variant = the cheese (the sideways label, for example "Standard
        Mozzarella" or "Reduced Fat Mozzarella") when the table has one, then the crust text if it is printed beside the row, then
        the size, separated by " - ". values = every figure of the row keyed by its printed column header written as "<table
        title> / <column header> <unit>" (for example "Per Pizza / Energy kcal", "Per Slice / Fat g").
      # Printed header -> column; the model writes each as '<table title> / <column header> <unit>'.
      header_columns:
        'Per Pizza / Energy kcal': energykCal_Per Pizza
        'Per Pizza / Energy kJ': energykJ_Per Pizza
        'Per Pizza / Fat g': fat_Per Pizza
        'Per Pizza / Sat g': saturates_Per Pizza
        'Per Pizza / Carb g': carbohydrates_Per Pizza
        'Per Pizza / Sugars g': sugars_Per Pizza
        'Per Pizza / Fibre g': fibre_Per Pizza
        'Per Pizza / Protein g': protein_Per Pizza
        'Per Pizza / Salt g': salt_Per Pizza
        'Per Pizza / Sodium g': sodium_Per Pizza
        'Per Slice / Energy kcal': energykCal_Per Slice
        'Per Slice / Energy kJ': energykJ_Per Slice
        'Per Slice / Fat g': fat_Per Slice
        'Per Slice / Sat g': saturates_Per Slice
        'Per Slice / Carb g': carbohydrates_Per Slice
        'Per Slice / Sugars g': sugars_Per Slice
        'Per Slice / Fibre g': fibre_Per Slice
        'Per Slice / Protein g': protein_Per Slice
        'Per Slice / Salt g': salt_Per Slice
        'Per Slice / Sodium g': sodium_Per Slice

58_Vue:
  chain: Vue
  allergens: false # the March 2026 batch has nutrition only (docs/goal-batch-2026-03.md)
  sources:
    # The text layer of these PDFs is corrupt (the embedded font drops characters: 197 prints as 19), so the page
    # images are read by the model (parser vision_table). No allergen information in these PDFs. (The September 2026 batch has only the drinks and sweets PDFs: no food or ice-cream PDF.)
    - pdf: m20645-nutritional-info-drinks.pdf
      parser: vision_table
      region: UK
      category: drinks
      approved: true
      instructions: >-
        It is a nutrition table of cinema drinks; all figures are per portion. section = the orange heading above the
        rows ("DISPENSED SOFT DRINKS"). Each drink is a bold name line (it can wrap onto two lines: join them) followed by
        several rows whose left cell (Portion/Pack Size) is a size such as "Large", "Regular", "Junior", "Kids": for those
        rows name = the bold name above them, size = the left cell, portion = empty. For an item that has a single row
        with a volume or count in the left cell, name = the bold name, size = empty, portion = that cell.
        Many items (the PACKAGED DRINKS pages, and some others) have two figure lines: the first is level with the bold name and its Portion/Pack Size cell is empty, the second is the next line and its
        Portion/Pack Size cell holds a volume ("500", "250", "200", "330", "275"). Return both lines as two rows with the same name: first row portion = empty, second row portion = that volume exactly as printed.
        Never leave the volume out and never drop either line. Copy names exactly as printed, including the apostrophe in F’Real (a typographic apostrophe) and letters and digits in names such as J2O.
      fields: &vue_fields
        kj: energykJ_Per Portion
        kcal: energykCal_Per Portion
        protein: protein_Per Portion
        carbohydrate: carbohydrates_Per Portion
        sugars: sugars_Per Portion
        fat: fat_Per Portion
        saturates: saturates_Per Portion
        fibre: fibre_Per Portion
        sodium: sodium_Per Portion
        salt: salt_Per Portion
    - pdf: m20685-nutritional-info-sweets.pdf
      parser: vision_table
      region: UK
      category: food
      approved: true
      dpi: 130 # a second read at another resolution than the first (150) after the first misread Haribo Gold Bears saturates (0.5 for 0.1)
      instructions: >-
        It is a nutrition table of sweets; all figures are per portion. section = the orange heading above the rows
        ("PICK'N'MIX"). name = the bold item name exactly as printed (it may contain " - "); size = empty;
        portion = the Portion/Pack Size cell ("100g").
      fields: *vue_fields
