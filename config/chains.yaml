46_Cineworld:
  chain: Cineworld
  sources:
    - pdf: 25-04-03_20Cineworld_20Allergen_20and_20Nutritional_20Information.pdf
      parser: allergen_matrix
      region: UK
      category: food
      approved: true
      # Key (page 1 and every page header): "✓ - Contains", "▲ - May Contain". It does not say what a blank cell
      # means, so a blank is "not stated". The PDF is an allergen matrix with calories only.
      markers: { '✓': 'Yes', '▲': 'May contain', '': '' }
      disclaimer: 'We cannot guarantee that any of our products are free of a particular allergen due to the use of shared equipment, utensils, cooking methods and open product handling on site.'
      sizes: [Large, Regular, Small, Medium, Pint, Half Pint, Splash, Munchbox]
      variants:
