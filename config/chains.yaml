        without the price and the description. kcal = the digits of the figure in brackets (no thousands comma). EVERY figure in brackets followed by "cal" or "kcal" on the page is exactly one
        row ("(952 cal. / 1044 kcal.)" is two figures: one per variant, bap or wrap): a dish with several figures (one per size or flavour) gives one row per figure named "<dish> - <the size or flavour as printed>"; an option line such as "ADD
        BACON (104 kcal.)" is a row named by its text, notes = "Add-on to <the dish>". A figure printed inside a dish's description ("Served with house fries (197 kcal.) or house salad (82 kcal.)") is a row named "<the dish> - <the item as printed>" (for
        example "HOT HONEY CHICKEN - house fries"), notes = "In the description of <the dish>"; a figure in a section note that applies to a whole section ("Our Kids meals are served with
