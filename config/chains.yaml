69_TescoCafe: # id and key from Menu Tracker's food-chains/
  chain: Tesco
  allergens: false # the March 2026 batch has nutrition only (docs/goal-batch-2026-03.md)
  sources:
    # Allergen matrices of the Tesco cafes (drinks, breakfast, mains, kids, snacks, sides): the only nutrition is "kcal per serving", sometimes as a pair "275/355 kcal" (small / medium).
    - pdf: Summer+2026+GB+Allergen+Matrix+V5.pdf
      parser: vision_table
      region: UK
      category: food
      approved: true
      dpi: 200
      pages: ['2-20'] # Summer 2026 V5: 20 pages
      text_check: &tesco_check { field: kcal, pattern: '(\d+(?:/\d+)?)\s?kcal', ignore: [2000, '–', '-'], page_ignore: { '8': ['75', '50/75', '50 / 75'] } }
      instructions: &tesco_instructions >-
        It is a landscape allergen matrix of a cafe menu: a row per item with the item name on the left, "kcal per serving" next to it and allergen marks (Y or M) to the right. section = the page heading
        ("Allergens - Drinks", "Allergens - Breakfast" ... written as "Drinks", "Breakfast", "Breakfast Extras", "Mains", "Kids", "Snacks & Bakery", "Sides and Condiments"), or a sub-heading printed in the first column.
        name = the item exactly as printed (a name can wrap over two or three lines: join them; text in brackets that belongs to the name stays). kcal = the figure before "kcal" exactly as printed, with a slash
        when two figures are printed ("275/355"); notes = the size header printed above the kcal column on the page ("Small/Medium") when the figure is a pair, else empty. Items with a blank kcal cell or the word
        "kcal" only are not rows. Ignore every allergen mark. Return every item of the page.
      fields: &tesco_fields { kcal: energykCal_Per Portion, notes: notes }
    - pdf: Summer+2026+NI+Allergen+Matrix+V3.pdf
      parser: vision_table
      region: NI
      category: food
      approved: true
      dpi: 200
      pages: ['2-17'] # Summer 2026 V3: 17 pages
      text_check: *tesco_check
      instructions: *tesco_instructions
      fields: *tesco_fields

66_SohoCoffee: # id and key from Menu Tracker's food-chains/
  chain: Soho Coffee
  allergens: false # the March 2026 batch has nutrition only (docs/goal-batch-2026-03.md)
  sources:
    # Ingredient and nutrition guides (food and drinks): one product per row with vegetarian / vegan ticks, a long ingredient declaration and the nine nutrition figures
    # "per portion basis". The names are not in a bold font and the declarations are long, so the model reads the name and the figures.
    - pdf: 2026-Nutritional-Matrix-Food-V7.pdf
      parser: vision_table
      region: UK
      category: food
      approved: true
      dpi: 200
      pages: ['4-7', '9-15', '17-20', '22-23', '25', '27-28'] # dividers (MENU, COLD LUNCH, SPECIFIC) are 1-3, 8, 16, 21, 24, 26
      instructions: &soho_instructions >-
        It is a landscape ingredient and nutrition guide of a coffee shop: one product per row. Columns: Product (with a short name on the left), Vegetarian?, Vegan?, Ingredients (long text),
        then Energy (kJ), Energy (kcal), Fat (g), Of which saturates (g), Carbohydrates (g), Of which sugars (g), Fibre (g), Protein (g), Salt (g). section = the group heading printed in the product column
        or above the rows (for example "Pastries", "Iced Tea"), or the menu named in the page head if there is none. name = the Product exactly as printed (it wraps over several lines: join them; a bracket
        such as "(whole milk)" belongs to the name). The words "ALLERGEN UPDATE" (a tag printed under some oat-milk names) are not part of the name: leave them out. Ignore the ingredients and the ticks. The nine figures are exactly as printed, as strings; leave a blank cell empty. Return every product of the page.
      fields: &soho_fields { kj: energykJ_Per Portion, kcal: energykCal_Per Portion, fat: fat_Per Portion, saturates: saturates_Per Portion, carbohydrate: carbohydrates_Per Portion, sugars: sugars_Per Portion, fibre: fibre_Per Portion, protein: protein_Per Portion, salt: salt_Per Portion }
