    # Nutrition guide, 24 pages (UK V2, 16.06.26): per 100g and per portion on every table, eight figures each (energy kJ and kcal, fat, saturates, carbohydrate, sugar, protein, salt; no fibre).
    - pdf: a7bddad7ab274475b481e054916a0f8208c4d24e.pdf
      parser: numeric_table
      region: UK
      category: food
      approved: true
      header: Energy
      wrapped_names: true
      wrap_below: true # a long name continues on the line under its figures
      wrap_below_lines: 2.5 # ...sometimes over two lines (ROI: Six Layer Lasagne even better with more beef ragu...)
      header_section: false # group titles are not readable (see above): no menu_section
      # The group titles (STARTERS, SALADS, PIZZA ...) are printed over the repeated word APERITIVO and come out interleaved or lost, so the guide's groups are NOT read: menu_section stays blank (limitation, see the report).
      furniture: [APERITIVO, Menu Item Name, DISHES, PIZZA, SOFT DRINKS, SUPERIORE, '& TEA', DRINK, 'COCKTAILS', 'BUBBLES', 'GUESTS']
      column_gap: 14 # centred one-digit cells (a salt of 1) sit up to 13 pt from their column's right edge
      columns:
        - energykJ_Per 100g/ml
        - energykCal_Per 100g/ml
        - fat_Per 100g/ml
        - saturates_Per 100g/ml
        - carbohydrates_Per 100g/ml
        - sugars_Per 100g/ml
        - protein_Per 100g/ml
        - salt_Per 100g/ml
        - energykJ_Per Portion
        - energykCal_Per Portion
        - fat_Per Portion
        - saturates_Per Portion
        - carbohydrates_Per Portion
        - sugars_Per Portion
        - protein_Per Portion
        - salt_Per Portion
