        as "750kcal" (sometimes "168kcal per sandwich" and "333kcal per wrap", or "per portion", "per skewer" or "per 2 spoonfuls"). section = the heading as printed (a sub-heading such as "CHOOSE YOUR STARTER" can follow it:
        then section = "<heading> - <sub-heading>"). name = the dish name as printed, in the case it is printed, without price, symbols or badges. kcal = the digits only, without a thousands comma. A dish with several figures
        (one per sandwich or wrap, per size or choice) gives one row per figure named "<dish> - <the label printed with the figure>" (for example "ROASTED PEPPER & HOUMOUS - per sandwich"). EVERY figure with "kcal" on the page
