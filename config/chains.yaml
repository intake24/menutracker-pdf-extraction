26_PapaJohns:
  chain: Papa Johns
  allergens: false # the March 2026 batch has nutrition only (docs/goal-batch-2026-03.md)
  sources:
    # The text layer is empty (image pages), so the pages are read by the model (parser vision_products).
    - pdf: nutritional-information.pdf
      parser: vision_products
      region: UK
      category: food
      approved: true
      golden: nutritional-information__2026-09 # the March and June 2026 PDFs have the same name
      # Pages with a table (February 2026 issue): pizzas 6-33, stuffed crust 34-38, sides and desserts 39-61, create-your-own 62-63,
      # bases and sauces 66, choux nuts 70. The other pages (cover, contents, welfare, allergen lists for the
      # create-your-own ingredients, drinks, Ben & Jerry's) carry no nutrition table; their allergens are not read yet.
      pages: ['7-64', '68-69', '76-78'] # August 2026 issue (AUG26-1): pizzas 7-42, sides 43-59, desserts 60-64, cooked ingredients (create-your-own) 68-69, new pizzas 76-78; 65-67 and 73-75 print "see individual pack" (no table), 70-72 and 79-81 are allergen lists
      dpi: 150
      skip_allergens: true # the March 2026 batch has no allergen columns
      share_per_100g: true # one VALUES PER 100G table serves every portion row of a product (the model fills it on one row only); copied cells are flagged
      # Each sheet lists the ingredient allergens per dough or base and what "may contain"; "None" is printed when empty,
      # so an allergen that is not listed is absent from the ingredients.
      markers: { '': 'No' }
      # Printed on page 4, not repeated on each sheet: the wheat free base is not suitable for people with Coeliac
      # disease (cross contact), pizzas made with it "may still have traces of wheat", pizzas without cheese may still have
      # traces of milk, and the vegan items are prepared where cheese (milk), egg and meat are handled. The rules below
      # turn the two row-specific warnings into "May contain" cells; the menu-wide ones stay here.
      rules:
        - { variant_has: Wheat Free, may_contain: [gluten, wheat] }
        - { section_has: VEGAN, may_contain: [milk, egg] }
      disclaimer: >-
        Pizzas without cheese may still have traces of milk; pizzas made with the Wheat Free base may still have traces of wheat; we make no claim that our products will be free from all allergens. Allergens: "None" refers to the ingredients themselves, not the finished product from store. All of our food is
        freshly prepared in store. We cannot guarantee that our products will be free from allergens / animal products
        due to the risk of cross contact when assembling the products. Product customisation may affect calorie content.
      # Note: the model uses the block headed 'ORIGINAL OR AUTHENTIC THIN CRUST BASE' for the stuffed crust rows too; the sheets
      # print no other block for them (page 38 names a 'Vegan Stuffed Crust' exception to it). Do not edit the instructions
      # text without meaning to re-read every page: it is part of the cache key.
      instructions: >-
        It is a Papa John's UK product sheet (one or two products per page). section = the coloured band at the bottom of
        the page (PIZZAS, SIDES, ...). name = the product title as printed (for a page with two products, each row gets
        the title of its own product). variant = the first-column label of the row in a 'SIZE & CRUST' table
        (for example 'Original Base - Medium'), or empty when the table has a single row. values = the cells of that row
        from every table on the sheet (the 'VALUES PER 100G' table and the 'VALUES PER SLICE' or 'VALUES PER PORTION'
        table). contains and may = the text under 'INGREDIENT ALLERGENS WITH ...' and 'INGREDIENT MAY CONTAIN' for the
        dough or base that this row's variant uses (a sheet can have a separate block for the wheat free base); when
        there is one block, use it for every row; leave both empty on a page without such text.
      # Printed header -> column. "per Total" is the whole product; "per Portion" is per slice/piece. The unit word
