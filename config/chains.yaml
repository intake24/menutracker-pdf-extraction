49_CookhousePub:
  chain: CookhousePub
  allergens: false # the March 2026 batch has nutrition only (docs/goal-batch-2026-03.md)
  sources:
    # Pub menus read by the model (the text layer of the main menu is partly garbled, but it prints the figures). Only kcal is printed. A dish has a bold name, a description and
    # "(429kcal)". Add-ons ("Add peppercorn sauce 1.79 (+39kcal)") are rows named by themselves, never with the name of the dish they go with; the figure is the digits only (the
    # sign and thousands comma are not part of the number). The figures of the text layer are checked against the rows (`text_check`).
    - pdf: cookhouse_and_pub_main_menu_priceless.pdf
      parser: vision_table
      region: UK
      category: food
      approved: true
      golden: cookhouse_and_pub_main_menu_priceless__2026-06 # the March 2026 PDF has the same name
      dpi: 250 # at 200 the model missed one figure of page 2 (790)
      pages: [2, 3, 4, 5, 6] # September 2026: the menu has six pages
      text_check: &ck_check {
          field: kcal,
          pattern: '(\d[\d,]*)\s?kcal(?!\s*per (?:serve|portion))',
          strip: ',',
          ignore: [1800, 2000],
        } # the footer: adults need around 1800 or 2000 kcal
      drop_rows: ['Swap chips & onion rings for a fresh mixed salad'] # a choice that saves 398 kcal from the steak it goes with (research team, 2026-10-12), not a food
      instructions: &ck_instructions >-
        It is a pub menu page with section headings (for example "Scrummy STARTERS" or "Starters & SHARERS"; section = the heading as printed, with its mixed capitals;
        a heading can have a sub-heading such as "ADD A DESSERT": then section = "<heading> - <sub-heading>"). A dish is a bold name, a description and the calories in
        brackets, for example "(429kcal)", with a price or not. name = the bold name as printed, without the price, without footnote symbols (§ * ' ¥ and similar) and
        without badges (House fave, EW). kcal = the digits of the figure only: no thousands comma, no plus or minus sign ("(1,706kcal serves 2, 853kcal per serve)" gives
        1706 for the dish: the per-serve figure is not a row; "(+39kcal)" gives 39; "(-398kcal)" gives 398). EVERY figure in brackets with "kcal" on the page is one row, also
        the figures of add-ons and options: a line such as "Add peppercorn sauce 1.79 (+39kcal)" or "Swap chips & onion rings for a fresh mixed salad (-398kcal)" or
        "Upgrade your 4oz steak to an 8oz steak for 3.99 (+160kcal)" is a row named by the text of that line without its price and kcal (never with the name of the dish it is
        printed under), notes = "Add-on to <the dish it goes with>" (or "Swap on <dish>"; add "printed as -398kcal" when the figure had a sign). A dish with several figures (one
        per size, flavour or choice) gives one row per figure named "<dish> - <the choice as printed>". A line that changes the dish above it ("Vegan option available, just ask (150kcal)",
        "Make it veggie, swap to ... (279kcal)") is a variant: name = "<that dish> - <the line as printed>" (an add-on, upgrade or swap that adds to the meal is not a variant and keeps
        its own name). One sentence with several figures ("Swap your Skin-on Chips (158kcal) for Mash (110kcal) or Mini Jacket Potatoes (155kcal)") gives a row named by the first item
        ("Skin-on Chips", 158) and a row for each next figure named by the whole phrase ("Swap your Skin-on Chips for Mash", 110). A name with alternatives ("Fruit Shoot Apple &
        Blackcurrant or Orange") is one name, whole. Do not return prices, text without a kcal figure, the drinks list
        without kcal, allergen keys or badges. Before you answer, count the brackets with "kcal" on the page and check that you return exactly that many rows.
      fields: &ck_fields { kcal: energykCal_Per Portion, notes: notes }
    - pdf: cookhouse_and_pub_kids_menu_default.pdf
      parser: vision_table
      region: UK
      category: food
      approved: true
      golden: cookhouse_and_pub_kids_menu_default__2026-06 # the May 2025 PDF has the same name
      dpi: 250
      pages: [1, 2]
      text_check: { <<: *ck_check, page_ignore: { '2': [77] } } # page 2 prints "(77 / 74kcal)" for two juices: the 77 has no "kcal" after it
      instructions: *ck_instructions
      fields: *ck_fields
    - pdf: cookhouse_and_pub_breakfast_menu.pdf
      parser: vision_table
      region: UK
      category: breakfast # new in September 2026: a two-page breakfast menu, page 1 is the cover and page 2 holds the dishes with their kcal
      approved: true
      dpi: 250
      pages: [2]
      text_check: *ck_check
      instructions: *ck_instructions
      fields: *ck_fields

73_TopGolf:
  chain: TopGolf
  allergens: false # the March 2026 batch has nutrition only (docs/goal-batch-2026-03.md)
  sources:
    # Limited-time menu (12 pages; pages 11 and 12 print no figures) read by the model. A dish is a name in capitals, a price, "(839 kcal.)" and a description. Only kcal is
