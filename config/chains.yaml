        sub-heading (for example "VEGAN SHAKES" under "SHAKES"): then section = "<heading> - <sub-heading>" (for example "SHAKES - VEGAN SHAKES"). A dish is a name in capitals (it may
        wrap over two lines: join them), a price, the calories in brackets ("(839 kcal.)") and a description. name = the name as printed (keep its capitals), without the price and
        the description. kcal = the digits of the figure in brackets (no thousands comma). EVERY figure in brackets followed by "cal" or "kcal" on the page is exactly one row: a dish
        with several figures (one per size or flavour) gives one row per figure named "<dish> - <the size or flavour as printed>"; an option line such as "ADD BACON (104 kcal.)" is a row
        named by its text, notes = "Add-on to <the dish>". Do not return prices, descriptions, allergen keys or text without a kcal figure. Before you answer, count the brackets with
        "kcal" on the page and check that you return exactly that many rows.
      fields: { kcal: energykCal_Per Portion, notes: notes }

