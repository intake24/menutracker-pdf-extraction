[project]
name = "menutracker-pdf-extraction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
sdk = ["anthropic>=0.40"]   # only for `--backend sdk`

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
