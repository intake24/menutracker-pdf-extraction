# Draft sources for 6_Dominos (parser grouped_table). NOT in config/chains.yaml: the first source (pages 3-13) matches 1,148 rows of Pearl Scan's 1,422 with every cell agreeing (recall 80.6%, 1 cell errata); the second (page 2) does not parse yet (the page mixes rows with their own pizza name and groups of sizes). Pages 14-18 (bases, sauces, cheese, toppings) have no source yet. See the project notes.
6_Dominos_extra_sources:
    - pdf: nutrition_pizzas.pdf
      parser: grouped_table
      region: UK
      category: food
      approved: false
      # No allergen information in this PDF. Pages 3-13: pizza name, rotated cheese label, crust, then one row per size.
      pages: ["3-13"]
      size_x0: 165
      size_order: [Large, Medium, Small, Personal]
      left:
        - { column: Product_Name, x0: 0, starts_at: { Cheese: Standard Mozzarella } }
        - { column: Cheese, x0: 86, rotated: true }
        - { column: Crust, x0: 96 }
      pearlscan: { "slice/portion/piece": ~ }
      # Figures left to right: ten per 100g, ten per pizza, ten per slice.
      columns:
        - energykCal_Per 100g/ml
        - energykJ_Per 100g/ml
        - fat_Per 100g/ml
        - saturates_Per 100g/ml
        - carbohydrates_Per 100g/ml
        - sugars_Per 100g/ml
        - fibre_Per 100g/ml
        - protein_Per 100g/ml
        - salt_Per 100g/ml
        - sodium_Per 100g/ml
        - energykCal_Per Pizza
        - energykJ_Per Pizza
        - fat_Per Pizza
        - saturates_Per Pizza
        - carbohydrates_Per Pizza
        - sugars_Per Pizza
        - fibre_Per Pizza
        - protein_Per Pizza
        - salt_Per Pizza
        - sodium_Per Pizza
        - energykCal_Per Slice
        - energykJ_Per Slice
        - fat_Per Slice
        - saturates_Per Slice
        - carbohydrates_Per Slice
        - sugars_Per Slice
        - fibre_Per Slice
        - protein_Per Slice
        - salt_Per Slice
        - sodium_Per Slice
