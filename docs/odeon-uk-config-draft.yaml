59_Odeon:
  chain: Odeon
  sources:
    - pdf: nutritional-information-may-2025-pdf-version-10-23_05_2025-uk-version.pdf
      parser: numeric_table
      region: UK
      category: food
      approved: true
      # No allergen information in this PDF (the pre-packed product matrix is a separate PDF), so no `markers`.
      header: Energy
      wrapped_names: true
      text_flow: true # page 1 has rows printed over each other
      free_sections: true # sub-section titles ("Toppings (Condiments)") sit between rows
      invalid_values: ['#N/A'] # a hidden row under "Guacamole" has Excel errors instead of figures
      name_amount: true # "Bacon Bits - 18g", "Regular Lemonade - 22oz Freestyle": the amount is the serving size
      columns:
        - energykJ_Per Portion
        - energykCal_Per Portion
        - fat_Per Portion
        - saturates_Per Portion
        - carbohydrates_Per Portion
        - sugars_Per Portion
        - protein_Per Portion
        - sodium_Per Portion
        - salt_Per Portion
        - fibre_Per Portion
